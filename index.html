<style>
  :root { --ink:#f3e9e4; --dim:#8a807c; --rose:#ff5a76; --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; --serif:"Cormorant Garamond", Georgia, serif; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:#000; color:var(--ink); overflow:hidden; overscroll-behavior:none; }
  canvas { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; display:block; }
  #glow { filter:blur(7px) brightness(1.5); opacity:.55; mix-blend-mode:screen; pointer-events:none; }

  .screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
            padding:24px 16px; text-align:center; font-family:var(--mono); transition:opacity .9s ease; z-index:5; }
  .screen.hidden { opacity:0; pointer-events:none; }
  .big { font-size:clamp(44px, 16vw, 88px); font-weight:300; letter-spacing:.06em; text-shadow:0 0 22px rgba(255,120,140,.45); }
  .sub { color:var(--dim); font-size:12px; letter-spacing:.18em; text-transform:uppercase; }
  .count { font-size:clamp(22px, 7vw, 34px); letter-spacing:.12em; font-variant-numeric:tabular-nums; }
  .hint { color:var(--dim); font-size:13px; max-width:30ch; line-height:1.5; white-space:pre-line; }
  form { display:flex; gap:8px; margin-top:6px; }
  input { font:inherit; font-size:16px; color:var(--ink); background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.18);
          border-radius:10px; padding:11px 14px; width:min(62vw, 230px); text-align:center; outline:none; letter-spacing:.12em; }
  input:focus { border-color:rgba(255,90,118,.7); box-shadow:0 0 0 3px rgba(255,90,118,.15); }
  button { font:inherit; font-size:15px; color:#000; background:var(--ink); border:0; border-radius:10px; padding:11px 16px; cursor:pointer; }
  .blanks { display:flex; align-items:flex-end; justify-content:center; gap:.55ch; font:400 clamp(26px, 8vw, 34px) var(--mono); color:var(--ink); }
  .blanks input { font:inherit; color:inherit; background:none; border:0; border-bottom:2px solid rgba(255,255,255,.45); border-radius:0;
                  padding:2px 0 4px; text-align:center; letter-spacing:.18em; text-transform:lowercase; outline:none; box-shadow:none; }
  .blanks input:focus { border-bottom-color:var(--rose); box-shadow:0 6px 10px -8px rgba(255,90,118,.8); }
  .blanks .lit { padding-bottom:6px; color:var(--dim); }
  #form { flex-direction:column; align-items:center; gap:18px; }
  .err { color:var(--rose); font-size:12px; min-height:1.2em; }
  .shake { animation:shake .4s; }
  @keyframes shake { 20%,60%{transform:translateX(-7px)} 40%,80%{transform:translateX(7px)} }
  .tap { font-size:15px; letter-spacing:.2em; animation:pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.35 } }

  #hud { position:fixed; left:14px; bottom:calc(12px + env(safe-area-inset-bottom)); font:10.5px/1.55 var(--mono); color:#6f6763;
         white-space:pre; z-index:3; transition:opacity .8s; pointer-events:none; }
  #clock { position:fixed; right:14px; top:calc(12px + env(safe-area-inset-top)); font:10.5px var(--mono); color:#c9586b; z-index:3; transition:opacity .8s; pointer-events:none; }
  #clock::before { content:"● "; }
  #clock:empty { display:none; }

  #letter { position:fixed; left:0; right:0; bottom:0; height:62vh; height:62dvh; overflow-y:auto; -webkit-overflow-scrolling:touch;
            padding:34px max(18px, calc(50vw - 300px)) calc(56px + env(safe-area-inset-bottom));
            background:linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,.96) 30px, #000 60px);
            opacity:0; transform:translateY(24px); transition:opacity 1.4s ease, transform 1.4s ease; z-index:4; pointer-events:none; }
  #letter.show { opacity:1; transform:none; pointer-events:auto; }
  .lt-head { font:11px var(--mono); color:#7d7470; margin-bottom:16px; letter-spacing:.04em; }
  #lt-body { font:400 19.5px/1.62 var(--serif); white-space:pre-wrap; word-wrap:break-word; color:var(--ink); }
  #lt-body .cur { display:inline-block; width:.5ch; height:1.05em; vertical-align:-.15em; background:var(--rose); margin-left:1px; animation:pulse 1s steps(1) infinite; }
  #lt-sign { margin-top:22px; text-align:right; font:italic 400 21px/1.5 var(--serif); opacity:0; transition:opacity 1.6s; white-space:pre-wrap; }
  #lt-sign.show { opacity:1; }
  #lt-foot { margin-top:30px; font:10.5px var(--mono); color:#5f5855; display:flex; justify-content:space-between; align-items:center; opacity:0; transition:opacity 1.6s 1s; }
  #lt-foot.show { opacity:1; }
  #lt-foot button { background:none; color:#8a807c; border:1px solid #3a3533; padding:6px 10px; font-size:11px; }
  @media (prefers-reduced-motion: reduce) { .tap, .cur { animation:none } }
</style>

// ───────────────────────────────────────────── math helpers

// ───────────────────────────────────────────── character grid
// light → dense; brightness picks the glyph, colour carries the image
const RAMP = " .'`^\",:;Il!i><~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";

const GLYPH = []; for (let i = 0; i < 128; i++) GLYPH[i] = String.fromCharCode(i);
const STYLE = new Array(32768);

function resize() {

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

}
const glyphFor = (b, i) => RAMP.charCodeAt(clamp(Math.round(b * (RL - 1) + (hash(i) - .5) * 4), 1, RL - 1));

function put(x, y, code, r, g, b) {

}
function putB(x, y, bright, r, g, b, code) {   // bright 0..1 → glyph + dimmed colour

function render() {

    const py = y * CHh;

// ───────────────────────────────────────────── stars (shared by every scene)
const STARS = Array.from({ length: 900 }, (_, i) => ({
  x: (hash(i * 3 + 1) - .5) * 12, y: (hash(i * 3 + 2) - .5) * 12, z: hash(i * 3 + 3),
  tw: 0.6 + hash(i + 5000) * 2.2, ph: hash(i + 7000) * TAU, big: hash(i + 9000) > 0.965,
  tint: hash(i + 11000)

function drawStars(t, D, alpha = 1, cx = W / 2, cy = H / 2) {
  for (const s of STARS) {
    const zz = (((s.z - D) % 1) + 1) % 1 * 0.97 + 0.03;
    const px = cx + s.x / zz * S * 0.18, py = cy + s.y / zz * S * 0.18;
    if (px < 0 || py < 0 || px >= W || py >= H) continue;
    const tw = 0.55 + 0.45 * Math.sin(t * s.tw + s.ph);
    const b = clamp(1.15 - zz) * tw * alpha;
    if (b < 0.06) continue;
    const gx = Math.floor(px / CW), gy = Math.floor(py / CHh);
    const r = 255, g = 235 - s.tint * 40, bl = 225 + s.tint * 30, k = 0.25 + 0.75 * b;
    put(gx, gy, b > .7 ? 43 /* + */ : b > .35 ? 42 /* * */ : 46 /* . */, r * k, g * k, bl * k);
    if (s.big && tw > 0.8 && b > 0.45) {           // sparkle arms
      const a = (tw - 0.8) * 5 * b;
      for (let d = 1; d <= 3; d++) {

    }
  }
}
const starTravel = (t) => 0.006 * t + 1.3 * Math.pow(smooth(T.ZOOM0, T.ZOOM1, t), 3);

// ───────────────────────────────────────────── timeline
let SECRET = null, PHOTOS = [], EYEIMG = null, T = {};
function buildTimeline() {
  const n = PHOTOS.length, PER = 4.8;

// ───────────────────────────────────────────── scene 1: the eye
